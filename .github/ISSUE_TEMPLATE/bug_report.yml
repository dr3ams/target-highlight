name: Bug report
description: Something doesn't work, looks wrong, or crashes the game
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more detail you give, the faster this can be fixed.
        Please attach `logs/latest.log` (or the crash report) below. It is the most useful thing you can send.
  - type: input
    id: mod_version
    attributes:
      label: Target Highlight version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft and Forge version
      placeholder: "1.20.1, Forge 47.4.0"
    validations:
      required: true
  - type: dropdown
    id: shaders
    attributes:
      label: Are you using a shader pack?
      options:
        - "No"
        - "Yes (name it in the description below)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Modpack or other mods
      description: Modpack name and version, or a list of the mods you think are relevant (rendering, combat, camera mods).
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots are very helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: config
    attributes:
      label: Config changes
      description: Did you change anything in `config/targethighlight-client.toml`? Paste the relevant lines.
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Drag and drop `logs/latest.log` or the crash report here, or paste the relevant part.
