name: Feature request
description: Suggest an idea or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve, or what are you trying to do?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, examples from other mods, or alternatives you considered.
